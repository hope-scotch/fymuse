# Cloudflare Pages Functions configuration.
#
# Sets the Workers compatibility date + enables nodejs_compat so
# youtubei.js (used by functions/api/yt.js) can use Buffer / streams
# / other Node-built-ins it relies on.
#
# The main app (index.html, _headers, logo.png) is plain static
# files — no build step. Only the functions/ folder needs a runtime.

name = "fymuse"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""
